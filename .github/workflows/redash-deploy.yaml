name: Deploy Redash
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (prod or Pre-Prod or stg or qa)'
        required: true
        type: choice
        options:
          - prod
          - qa
          
jobs:
  deploy:
    name: Deploy Redash with Helm
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLUSTER_NAME: mycluster-${{ inputs.environment }}-aks
      RESOURCE_GROUP: mycluster-${{ inputs.environment }}-apps-rg
      ENV: ${{ inputs.environment }}
      NAMESPACE: redash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
      - name: Add Redash Helm repo
        run: |
          helm repo add redash https://getredash.github.io/contrib-helm-chart/
          helm repo update
      - name: Create Redash namespace
        run: |
          kubectl create namespace $NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -
      # - name: Delete existing Redash server pod
      #   run: |
      #     kubectl delete pods -n $NAMESPACE \
      #       -l app.kubernetes.io/component=server \
      #       --ignore-not-found=true
      - name: Deploy Redash
        run: |
          helm upgrade --install redash redash/redash \
            --version 4.0.1 \
            --namespace $NAMESPACE \
            -f redash/${ENV}/values.yaml \
            --wait \
            --timeout 10m
